# Every two months, on the 1st: one PR of minor and patch updates for pip, one
# for both npm folders, one for GitHub Actions. pip and npm major updates come
# as separate PRs, so one breaking upgrade doesn't hold up the rest.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    # Waits a week after a release, so a bad or hijacked release is usually pulled first.
    cooldown:
      default-days: 7
    # Indirect dependencies too, so fixes to them aren't missed.
    allow:
      - dependency-type: all
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/worker, /frontend]
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    cooldown:
      default-days: 7
    # Indirect dependencies too, so fixes to them aren't missed.
    allow:
      - dependency-type: all
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    groups:
      actions:
        patterns: ["*"]
