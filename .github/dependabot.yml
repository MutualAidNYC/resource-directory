# Every two months, on the 1st: one PR of minor and patch updates for pip, one
# for both npm folders, one for GitHub Actions. pip and npm major updates come
# as separate PRs, so one breaking upgrade doesn't hold up the rest. Security
# fixes come as one PR per ecosystem, when they're found.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    # Waits a week after a release, so a bad or hijacked release is usually pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Indirect dependencies too: pip-compile pins them, and they update cleanly as a group.
    allow:
      - dependency-type: all
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/worker, /frontend]
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # @types/node majors follow .nvmrc: bump them by hand with the Node version.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
